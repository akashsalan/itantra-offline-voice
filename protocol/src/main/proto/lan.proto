syntax = "proto3";
package org.itantra.protocol.lan;
option java_multiple_files = true;
option java_package = "org.itantra.protocol.lan";

// Additive LAN protocol. Existing Wi-Fi Direct / Classic Envelope is unchanged.
enum LanKind {
  LAN_UNSPECIFIED = 0; WELCOME = 1; JOIN = 2; ROSTER = 3;
  DATA = 4; RECEIPT = 5; HEARTBEAT = 6; FAILURE = 7;
}
message LanMember {
  string id = 1; // SHA-256 of the authenticated client certificate
  string name = 2;
  bool online = 3;
}
message LanPacket {
  uint32 version = 1;
  LanKind kind = 2;
  string room_id = 3;
  string room_name = 4;
  bool group = 5;
  string host_id = 6;
  string sender_id = 7;
  string sender_name = 8;
  string recipient_id = 9; // Empty means the room, never an implicit DM broadcast.
  repeated LanMember members = 10;
  bytes envelope = 11; // Existing checksum-verified v1 Envelope for text and ACK.
  string password = 12; // JOIN only, after user verifies TLS host; never persisted.
  repeated string targets = 13; // Original recipient snapshot; immutable on retry.
  uint64 room_order = 14;
  string error = 15;
  bool accepting = 16;
  uint32 crc32 = 17;
  fixed64 retry_id = 18; // New token only for an explicit user retry; automatic retries reuse it.
}
message LanNotice {
  uint32 version = 1;
  bool query = 2;
  string room_id = 3;
  string room_name = 4;
  string host_name = 5;
  bool group = 6;
  uint32 port = 7;
  uint32 members = 8;
}
